<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aero Сапёр — Frutiger Aero Minesweeper</title>
  <link rel="stylesheet" href="style.css" />
  <script defer src="storage.js"></script>
  <script defer src="audio.js"></script>
  <script defer src="physics.js"></script>
  <script defer src="game.js"></script>
</head>
<body>
  <!-- Фон Frutiger Aero -->
  <div class="aero-bg" aria-hidden="true">
    <div class="sun-glow"></div>
    <div class="cloud cloud-1"></div>
    <div class="cloud cloud-2"></div>
    <div class="cloud cloud-3"></div>

    <div class="city-skyline">
      <div class="tower tower-1"></div>
      <div class="tower tower-2"></div>
      <div class="tower tower-3"></div>
    </div>

    <div class="hills-back"></div>
    <div class="lake">
      <div class="lake-shimmer"></div>
    </div>
    <div class="hills-front"></div>

    <div class="floating-bubbles">
      <span class="bg-bubble b1"></span>
      <span class="bg-bubble b2"></span>
      <span class="bg-bubble b3"></span>
      <span class="bg-bubble b4"></span>
      <span class="bg-bubble b5"></span>
    </div>
  </div>

  <!-- Стеклянное окно Windows 7 / Vista Aero -->
  <main class="aero-window" id="aeroWindow">
    <header class="window-titlebar">
      <h1 class="window-title">Aero Сапёр</h1>

      <div class="titlebar-right">
        <div class="mode-pill" id="modeBadge">
          <span class="pill-dot"></span>
          <span id="modeBadgeText">новичок 9×9</span>
        </div>

        <div class="window-controls">
          <button class="win-btn" id="btnMin" title="Свернуть" aria-label="Свернуть">—</button>
          <button class="win-btn" id="btnMax" title="Развернуть" aria-label="Развернуть">□</button>
          <button class="win-btn win-close" id="btnClose" title="Закрыть" aria-label="Закрыть">✕</button>
        </div>
      </div>
    </header>

    <div class="window-body">
      <!-- Игровое поле -->
      <section class="board-panel" id="boardPanel">
        <canvas class="fx-canvas" id="fxCanvas" aria-hidden="true"></canvas>

        <div class="board-scroll">
          <div class="board" id="board" role="grid" aria-label="Игровое поле Сапёра"></div>
        </div>

        <div class="board-overlay hidden" id="boardOverlay">
          <div class="overlay-card">
            <h2 id="overlayTitle">Победа!</h2>
            <p id="overlaySub">Поле очищено</p>
            <button class="aero-btn aero-btn-green jelly-ui" id="overlayRestart">
              сыграть ещё раз
            </button>
          </div>
        </div>
      </section>

      <!-- Правая боковая панель -->
      <aside class="sidebar">
        <div class="aero-card">
          <h2 class="card-title">статистика</h2>
          <div class="stat-row">
            <span>мины</span>
            <strong id="minesLeft">10</strong>
          </div>
          <div class="stat-row">
            <span>время</span>
            <strong id="timer">000</strong>
          </div>
          <div class="stat-row">
            <span>рекорд</span>
            <strong id="bestTime">—</strong>
          </div>
        </div>

        <div class="aero-card">
          <h2 class="card-title">сложность</h2>
          <div class="diff-group">
            <button class="aero-btn diff-btn jelly-ui active" data-diff="easy">новичок</button>
            <button class="aero-btn diff-btn jelly-ui" data-diff="medium">любитель</button>
            <button class="aero-btn diff-btn jelly-ui" data-diff="hard">профи</button>
          </div>
          <button class="aero-btn aero-btn-green jelly-ui full-btn" id="btnSwapControls">
            🔄 ЛКМ: открыть · ПКМ: флаг
          </button>
        </div>

        <div class="aero-card">
          <h2 class="card-title">управление</h2>
          <button class="aero-btn jelly-ui full-btn" id="btnSound">
            🔊 звук: вкл
          </button>
          <button class="aero-btn jelly-ui full-btn" id="btnRestart">
            начать заново
          </button>
          <p class="controls-hint" id="controlsHint">
            ЛКМ — открыть клетку<br />
            ПКМ — поставить флажок<br />
            Клик по цифре — открыть вокруг
          </p>
        </div>

        <!-- Твой маскот -->
        <div class="mascot-area">
          <div class="mascot-speech" id="mascotSpeech">Кликай смелее — первый ход безопасен!</div>
          <div class="mascot jelly-ui" id="mascot" title="Нажми на меня!">
            <img src="mascot.png" alt="Маскот" class="mascot-img" draggable="false" />
          </div>
        </div>
      </aside>
    </div>
  </main>
</body>
</html>
